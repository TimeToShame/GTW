<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профиль близкого - WTG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/icons.css">
    <style>
        .person-header {
            background: var(--gradient-primary);
            color: #000;
            padding: 24px 16px;
            margin: -16px -16px 24px -16px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 0 30px rgba(255, 149, 0, 0.5),
                        0 8px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: slide-glow-right 0.6s ease-out;
        }

        .person-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
            animation: shimmer-shine 3s infinite;
        }

        @keyframes header-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 149, 0, 0.4); }
            50% { box-shadow: 0 0 40px rgba(255, 149, 0, 0.6); }
        }

        .person-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .person-info {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .person-info svg {
            width: 18px;
            height: 18px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 12px 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            box-shadow: 0 0 10px var(--accent),
                        0 0 20px var(--accent);
            border-radius: 3px 3px 0 0;
            animation: neon-pulse 2s ease-in-out infinite;
        }

        .tab svg {
            width: 18px;
            height: 18px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .gift-card {
            background: var(--gradient-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .gift-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--gradient-primary);
            border-radius: 16px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gift-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: var(--gradient-hover);
            box-shadow: 0 0 20px rgba(255, 149, 0, 0.5),
                        0 0 40px rgba(255, 149, 0, 0.3),
                        0 12px 30px rgba(0, 0, 0, 0.4);
            border-color: var(--accent);
        }

        .gift-card:hover::before {
            opacity: 0.3;
        }

        .gift-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--border);
        }

        .gift-info {
            padding: 12px;
        }

        .gift-title {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gift-price {
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
        }

        .booked-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--gradient-primary);
            color: #000;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 149, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-secondary);
        }

        .empty-icon {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
        }

        .empty-icon svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
        }

        .add-idea-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: #000;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 149, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .add-idea-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--glow-strong);
        }

        .add-idea-btn:active {
            transform: scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <!-- Floating Particles Background -->
    <div class="particle-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="backBtn">←</button>
            <h1 class="header-title">Профиль</h1>
        </div>
        <button class="menu-btn" id="deletePersonBtn" style="background: #e53935; border-color: #e53935; color: white;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </header>

    <main class="main">
        <div class="container">
            <!-- Person Header -->
            <div class="person-header">
                <div class="person-name" id="personName">Загрузка...</div>
                <div class="person-info" id="personInfo"></div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="wishlist">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 12V21H4V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M22 7H2V12H22V7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 21V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Wishlist
                </button>
                <button class="tab" data-tab="ideas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10 22H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M15.09 14C16.5461 12.9164 17.5 11.2067 17.5 9.25C17.5 5.93629 14.8137 3.25 11.5 3.25C8.18629 3.25 5.5 5.93629 5.5 9.25C5.5 11.2067 6.45391 12.9164 7.91 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Мои идеи
                </button>
            </div>

            <!-- Tab: Wishlist -->
            <div class="tab-content active" id="wishlist-content">
                <div class="gift-grid" id="wishlistGrid"></div>
                <div class="empty-state" id="wishlistEmpty" style="display: none;">
                    <div class="empty-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 12V21H4V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M22 7H2V12H22V7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 21V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M12 7H7.5C6.83696 7 6.20107 6.73661 5.73223 6.26777C5.26339 5.79893 5 5.16304 5 4.5C5 3.83696 5.26339 3.20107 5.73223 2.73223C6.20107 2.26339 6.83696 2 7.5 2C11 2 12 7 12 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 7H16.5C17.163 7 17.7989 6.73661 18.2678 6.26777C18.7366 5.79893 19 5.16304 19 4.5C19 3.83696 18.7366 3.20107 18.2678 2.73223C17.7989 2.26339 17.163 2 16.5 2C13 2 12 7 12 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div>Wishlist пуст</div>
                </div>
            </div>

            <!-- Tab: My Ideas -->
            <div class="tab-content" id="ideas-content">
                <div class="gift-grid" id="ideasGrid"></div>
                <div class="empty-state" id="ideasEmpty" style="display: none;">
                    <div class="empty-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 18H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M10 22H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M15.09 14C16.5461 12.9164 17.5 11.2067 17.5 9.25C17.5 5.93629 14.8137 3.25 11.5 3.25C8.18629 3.25 5.5 5.93629 5.5 9.25C5.5 11.2067 6.45391 12.9164 7.91 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div>У вас пока нет идей подарков</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Idea Button (only visible in My Ideas tab) -->
    <button class="add-idea-btn" id="addIdeaBtn" style="display: none;">+</button>

    <!-- Modal for Gift Details / Add Idea -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">Подарок</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script>
        let currentPerson = null;
        let currentTab = 'wishlist';
        let wishlistItems = [];
        let personalIdeas = [];

        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const personDbId = urlParams.get('person_db_id');
        const personIdParam = urlParams.get('person_id'); // Telegram ID если есть

        if (!personDbId) {
            API.showAlert('Не указан ID близкого');
            window.location.href = 'friends.html';
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', async function() {
            API.initTelegram();

            // Загружаем данные близкого
            await loadPersonData();

            // Загружаем wishlist и идеи
            // Проверяем наличие person_id (из URL параметра или из данных БД)
            const hasPersonId = personIdParam || (currentPerson && currentPerson.person_id);

            if (hasPersonId) {
                await loadWishlist();
            } else {
                // Если нет person_id, скрываем вкладку Wishlist и показываем только "Мои идеи"
                document.querySelector('[data-tab="wishlist"]').style.display = 'none';
                switchTab('ideas');
            }
            await loadPersonalIdeas();

            // Кнопка назад
            document.getElementById('backBtn').addEventListener('click', () => {
                window.location.href = 'friends.html';
            });

            // Кнопка удаления
            document.getElementById('deletePersonBtn').addEventListener('click', handleDeletePerson);

            // Переключение вкладок
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    switchTab(tabName);
                });
            });

            // Кнопка добавить идею
            document.getElementById('addIdeaBtn').addEventListener('click', () => {
                showAddIdeaModal();
            });

            // Закрытие модального окна
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            });
        });

        async function loadPersonData() {
            try {
                const data = await API.getClosePeople();
                // Ищем по person_db_id (ID из БД)
                currentPerson = data.people.find(p => p.id === parseInt(personDbId));

                if (currentPerson) {
                    document.getElementById('personName').textContent = currentPerson.name;

                    let infoHtml = [];
                    if (currentPerson.relation) {
                        infoHtml.push(`<span>${currentPerson.relation}</span>`);
                    }
                    if (currentPerson.birthdate) {
                        infoHtml.push(`
                            <span style="display: flex; align-items: center; gap: 4px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M20 21H4C3.46957 21 2.96086 20.7893 2.58579 20.4142C2.21071 20.0391 2 19.5304 2 19V17C2 16.4696 2.21071 15.9609 2.58579 15.5858C2.96086 15.2107 3.46957 15 4 15H20C20.5304 15 21.0391 15.2107 21.4142 15.5858C21.7893 15.9609 22 16.4696 22 17V19C22 19.5304 21.7893 20.0391 21.4142 20.4142C21.0391 20.7893 20.5304 21 20 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M7 15V12M12 15V12M17 15V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    <circle cx="7" cy="5" r="1.5" fill="currentColor"/>
                                    <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
                                    <circle cx="17" cy="5" r="1.5" fill="currentColor"/>
                                    <path d="M7 8V7M12 8V7M17 8V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                ${currentPerson.birthdate}
                            </span>
                        `);
                    }

                    document.getElementById('personInfo').innerHTML = infoHtml.join(' • ');
                } else {
                    API.showAlert('Близкий человек не найден');
                    window.location.href = 'friends.html';
                }
            } catch (error) {
                console.error('Error loading person:', error);
                API.showAlert('Не удалось загрузить данные');
            }
        }

        async function loadWishlist() {
            try {
                // Используем person_id (Telegram ID) для получения wishlist
                // Приоритет: параметр из URL → данные из БД
                const telegramId = personIdParam || (currentPerson && currentPerson.person_id);

                if (!telegramId) {
                    document.getElementById('wishlistEmpty').style.display = 'block';
                    return;
                }

                const data = await API.getPersonWishlist(telegramId);
                wishlistItems = data.items || [];
                renderWishlist();
            } catch (error) {
                console.error('Error loading wishlist:', error);
                document.getElementById('wishlistEmpty').style.display = 'block';
            }
        }

        async function loadPersonalIdeas() {
            try {
                if (!currentPerson) {
                    document.getElementById('ideasEmpty').style.display = 'block';
                    return;
                }

                // Для личных идей используем person_id если есть, иначе используем персональный идентификатор
                // Приоритет: параметр из URL → данные из БД → manual ID
                const telegramId = personIdParam || currentPerson.person_id;
                const forPersonId = telegramId || `manual_${currentPerson.id}`;

                const data = await API.getPersonalIdeas(forPersonId);
                personalIdeas = data.ideas || [];
                renderPersonalIdeas();
            } catch (error) {
                console.error('Error loading ideas:', error);
                document.getElementById('ideasEmpty').style.display = 'block';
            }
        }

        function renderWishlist() {
            const grid = document.getElementById('wishlistGrid');
            const empty = document.getElementById('wishlistEmpty');

            if (wishlistItems.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = wishlistItems.map(item => `
                <div class="gift-card" onclick="showGiftDetails(${item.id}, 'wishlist')">
                    ${item.image_url ? `<img src="${item.image_url}" class="gift-image" alt="${item.title}">` : '<div class="gift-image"></div>'}
                    ${item.is_booked && !item.is_owner ? '<div class="booked-badge">Забронирован</div>' : ''}
                    <div class="gift-info">
                        <div class="gift-title">${item.title}</div>
                        ${item.price ? `<div class="gift-price">${item.price}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderPersonalIdeas() {
            const grid = document.getElementById('ideasGrid');
            const empty = document.getElementById('ideasEmpty');

            if (personalIdeas.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = personalIdeas.map(idea => `
                <div class="gift-card" onclick="showIdeaDetails(${idea.id})">
                    ${idea.image_url ? `<img src="${idea.image_url}" class="gift-image" alt="${idea.title}">` : '<div class="gift-image"></div>'}
                    <div class="gift-info">
                        <div class="gift-title">${idea.title}</div>
                        ${idea.price ? `<div class="gift-price">${idea.price}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tabName) {
            currentTab = tabName;

            // Переключаем вкладки
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Переключаем контент
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tabName}-content`).classList.add('active');

            // Показываем/скрываем кнопку добавить идею
            document.getElementById('addIdeaBtn').style.display = tabName === 'ideas' ? 'block' : 'none';
        }

        function showGiftDetails(itemId, source) {
            const item = wishlistItems.find(i => i.id === itemId);
            if (!item) return;

            const isOwner = item.is_owner;
            const isBooked = item.is_booked;

            document.getElementById('modalHeader').textContent = item.title;
            document.getElementById('modalBody').innerHTML = `
                ${item.image_url ? `<img src="${item.image_url}" style="width: 100%; border-radius: 8px; margin-bottom: 16px;" alt="${item.title}">` : ''}
                ${item.description ? `<p style="margin-bottom: 12px;">${item.description}</p>` : ''}
                ${item.price ? `<p style="color: var(--accent); font-weight: 600; font-size: 18px; margin-bottom: 12px;">${item.price}</p>` : ''}
                ${item.url ? `<a href="${item.url}" target="_blank" class="btn btn-secondary btn-block" style="margin-bottom: 8px;">Открыть ссылку</a>` : ''}
                ${!isOwner ? (isBooked
                    ? `<button class="btn btn-secondary btn-block" onclick="handleUnbookGift(${itemId})">Отменить бронь</button>`
                    : `<button class="btn btn-primary btn-block" onclick="handleBookGift(${itemId})">Забронировать</button>`
                ) : ''}
                <button class="btn btn-secondary btn-block" onclick="closeModal()" style="margin-top: 8px;">Закрыть</button>
            `;

            document.getElementById('modal').classList.add('active');
        }

        function showIdeaDetails(ideaId) {
            const idea = personalIdeas.find(i => i.id === ideaId);
            if (!idea) return;

            document.getElementById('modalHeader').textContent = idea.title;
            document.getElementById('modalBody').innerHTML = `
                ${idea.image_url ? `<img src="${idea.image_url}" style="width: 100%; border-radius: 8px; margin-bottom: 16px;" alt="${idea.title}">` : ''}
                ${idea.description ? `<p style="margin-bottom: 12px;">${idea.description}</p>` : ''}
                ${idea.price ? `<p style="color: var(--accent); font-weight: 600; font-size: 18px; margin-bottom: 12px;">${idea.price}</p>` : ''}
                ${idea.url ? `<a href="${idea.url}" target="_blank" class="btn btn-secondary btn-block" style="margin-bottom: 8px;">Открыть ссылку</a>` : ''}
                <button class="btn btn-danger btn-block" onclick="handleDeleteIdea(${ideaId})">Удалить</button>
                <button class="btn btn-secondary btn-block" onclick="closeModal()" style="margin-top: 8px;">Закрыть</button>
            `;

            document.getElementById('modal').classList.add('active');
        }

        function showAddIdeaModal() {
            document.getElementById('modalHeader').textContent = 'Добавить идею подарка';
            document.getElementById('modalBody').innerHTML = `
                <form id="addIdeaForm">
                    <div class="form-group">
                        <label>Ссылка на товар (необязательно)</label>
                        <input type="url" id="ideaUrl" class="form-input" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Название *</label>
                        <input type="text" id="ideaTitle" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Цена</label>
                        <input type="text" id="ideaPrice" class="form-input" placeholder="1000 ₽">
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="ideaDescription" class="form-input" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>URL изображения</label>
                        <input type="url" id="ideaImageUrl" class="form-input">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Добавить</button>
                    <button type="button" class="btn btn-secondary btn-block" onclick="closeModal()" style="margin-top: 8px;">Отмена</button>
                </form>
            `;

            // AI парсинг URL
            document.getElementById('ideaUrl').addEventListener('blur', async function() {
                const url = this.value.trim();
                if (url && isValidUrl(url)) {
                    try {
                        const result = await API.parseProductUrl(url);
                        if (result.success && result.data) {
                            document.getElementById('ideaTitle').value = result.data.title || '';
                            document.getElementById('ideaPrice').value = result.data.price || '';
                            document.getElementById('ideaDescription').value = result.data.description || '';
                            if (result.data.image_url) {
                                document.getElementById('ideaImageUrl').value = result.data.image_url;
                            }
                        }
                    } catch (error) {
                        console.error('Parse error:', error);
                    }
                }
            });

            document.getElementById('addIdeaForm').addEventListener('submit', handleAddIdea);
            document.getElementById('modal').classList.add('active');
        }

        async function handleBookGift(itemId) {
            try {
                await API.bookGift(itemId);
                API.showAlert('Подарок забронирован!');
                closeModal();
                await loadWishlist();
            } catch (error) {
                console.error('Book error:', error);
                API.showAlert('Не удалось забронировать');
            }
        }

        async function handleUnbookGift(itemId) {
            try {
                await API.unbookGift(itemId);
                API.showAlert('Бронь отменена');
                closeModal();
                await loadWishlist();
            } catch (error) {
                console.error('Unbook error:', error);
                API.showAlert('Не удалось отменить бронь');
            }
        }

        async function handleAddIdea(e) {
            e.preventDefault();

            // Используем тот же идентификатор что и в loadPersonalIdeas
            const telegramId = personIdParam || currentPerson.person_id;
            const forPersonId = telegramId || `manual_${currentPerson.id}`;

            const data = {
                for_person_id: forPersonId,
                title: document.getElementById('ideaTitle').value,
                price: document.getElementById('ideaPrice').value,
                description: document.getElementById('ideaDescription').value,
                url: document.getElementById('ideaUrl').value,
                image_url: document.getElementById('ideaImageUrl').value
            };

            try {
                await API.addPersonalIdea(data);
                API.showAlert('Идея добавлена!');
                closeModal();
                await loadPersonalIdeas();
            } catch (error) {
                console.error('Add idea error:', error);
                API.showAlert('Не удалось добавить идею');
            }
        }

        async function handleDeleteIdea(ideaId) {
            API.showConfirm('Удалить эту идею?', async (confirmed) => {
                if (confirmed) {
                    try {
                        await API.deletePersonalIdea(ideaId);
                        API.showAlert('Идея удалена');
                        closeModal();
                        await loadPersonalIdeas();
                    } catch (error) {
                        console.error('Delete error:', error);
                        API.showAlert('Не удалось удалить');
                    }
                }
            });
        }

        async function handleDeletePerson() {
            if (!currentPerson) return;

            API.showConfirm(`Удалить ${currentPerson.name} из близких?`, async (confirmed) => {
                if (confirmed) {
                    try {
                        await API.deleteClosePeople([currentPerson.id]);
                        API.showAlert('Удалено из близких');
                        window.location.href = 'friends.html';
                    } catch (error) {
                        console.error('Delete error:', error);
                        API.showAlert('Не удалось удалить');
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }
    </script>
</body>
</html>
